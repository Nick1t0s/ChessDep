<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — ChessDep</title>
  <link rel="stylesheet" href="css/base.css">
  <script type="module" src="js/register.js"></script>
</head>
<body>
  <main class="wrap">
    <h1 class="page-title">Регистрация</h1>
    <div class="card auth-card">
      <form id="register-form" class="auth-form-stack">
        <div class="field">
          <label for="login">Логин</label>
          <input id="login" name="login" type="text" autocomplete="username" required minlength="3" maxlength="16">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="128">
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
        </div>
        <button id="submit" class="btn btn-gold btn-block" type="submit">Создать аккаунт</button>
      </form>
      <p id="error" class="error-note"></p>
      <p class="auth-note">Уже есть аккаунт? <a href="/login.html">Вход</a></p>
    </div>
  </main>
</body>
</html>
