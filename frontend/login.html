<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — ChessDep</title>
  <link rel="stylesheet" href="css/base.css">
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <main class="wrap">
    <h1 class="page-title">Вход</h1>
    <div class="card auth-card">
      <form id="login-form" class="auth-form-stack">
        <div class="field">
          <label for="login">Логин</label>
          <input id="login" name="login" type="text" autocomplete="username" required maxlength="64">
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
        </div>
        <button id="submit" class="btn btn-gold btn-block" type="submit">Войти</button>
      </form>
      <p id="error" class="error-note"></p>
      <p class="auth-note">Нет аккаунта? <a href="/register.html">Регистрация</a></p>
    </div>
  </main>
</body>
</html>
