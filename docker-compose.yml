name: chessdep

x-backend: &backend
  build: ./backend
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  nginx:
    build: ./nginx
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  postgres-test:
    profiles: [test]
    image: postgres:16-alpine
    environment: {POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      retries: 30

  redis-test:
    profiles: [test]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  api-test:
    profiles: [test]
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://test:test@postgres-test:5432/test
      REDIS_URL: redis://redis-test:6379/0
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://test
      SESSION_TTL_DAYS: "30"
      TESTING: "1"
      FRONTEND_DIR: /frontend
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
    command: ["sh", "-c", "alembic upgrade head && pytest -q -p no:cacheprovider"]
    depends_on:
      postgres-test: {condition: service_healthy}
      redis-test: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
