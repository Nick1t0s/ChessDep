<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChessDep — Вход и регистрация</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-auth="optional">

<nav class="topbar">
  <a class="logo" href="index.html"><span class="logo-glyph">&#9822;&#xFE0E;</span>Chess<span class="logo-dot">Dep</span></a>
  <div class="nav-links">
    <a href="index.html">Главная</a>
    <a href="leaderboard.html">Топ</a>
  </div>
  <div class="nav-right" id="nav-right"></div>
</nav>

<main class="container">

  <div class="auth-wrap">
    <div class="auth-card panel">

      <div class="auth-tabs">
        <button data-tab="login" class="on">Вход</button>
        <button data-tab="register">Регистрация</button>
      </div>

      <form id="form-login" class="auth-form show" novalidate>
        <div class="auth-error" id="err-login"></div>
        <div class="field">
          <label>Логин</label>
          <input id="li-name" placeholder="Например Magnus_C" autocomplete="username">
          <span class="msg"></span>
        </div>
        <div class="field">
          <label>Пароль</label>
          <input id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password">
          <span class="msg"></span>
        </div>
        <button type="submit" class="btn btn-gold btn-block">Войти</button>
      </form>

      <form id="form-register" class="auth-form" novalidate>
        <div class="auth-error" id="rg-err"></div>
        <div class="field">
          <label>Логин</label>
          <input id="rg-name" placeholder="3–16 символов, латиница" autocomplete="off">
          <span class="msg"></span>
        </div>
        <div class="field">
          <label>Email</label>
          <input id="rg-email" type="email" placeholder="you@example.com" autocomplete="off">
          <span class="msg"></span>
        </div>
        <div class="field">
          <label>Пароль</label>
          <input id="rg-pass" type="password" placeholder="минимум 6 символов" autocomplete="new-password">
          <span class="msg"></span>
        </div>
        <div class="field">
          <label>Повтори пароль</label>
          <input id="rg-pass2" type="password" placeholder="ещё раз" autocomplete="new-password">
          <span class="msg"></span>
        </div>
        <label class="check">
          <input type="checkbox" id="rg-terms">
          <span>Согласен с правилами: фигуры виртуальные, шансы честные, если проиграл — сам виноват.</span>
        </label>
        <button type="submit" class="btn btn-violet btn-block">Создать аккаунт</button>
      </form>

      <p class="auth-note is-first" id="first-note"></p>
      <p class="auth-note">Демо-система: аккаунты хранятся в localStorage этого браузера.<br>Первый зарегистрированный игрок автоматически получает <b>админку</b> → <a href="admin.html">admin.html</a></p>

    </div>
  </div>

</main>

<div class="toasts" id="toasts"></div>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
