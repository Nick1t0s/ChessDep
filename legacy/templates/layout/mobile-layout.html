<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Шаблон 19 — мобильный шелл (tab-bar + safe-area)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(900px 400px at 50% -10%,rgba(139,92,246,.15),transparent 60%),#0b0e16;color:#e8ecf4;font-family:system-ui,-apple-system,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(9,11,17,.82);backdrop-filter:blur(12px);border-bottom:1px solid #242b3d}
.logo{font-weight:800;font-size:16px;letter-spacing:.3px}
.logo i{color:#ffc93c;font-style:normal}
.chip{margin-left:auto;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:11px;background:#161b29;border:1px solid #242b3d;font-family:ui-monospace,monospace;font-size:12.5px}
.chip i{color:#ffc93c;font-style:normal}

.scroll-x{display:flex;gap:10px;overflow-x:auto;padding:12px 14px 2px;scrollbar-width:none;-ms-overflow-style:none}
.scroll-x::-webkit-scrollbar{display:none}
.mini-case{--top:#ffc93c;flex:0 0 auto;padding:10px 14px;border-radius:14px;border:1px solid #242b3d;background:linear-gradient(180deg,color-mix(in srgb,var(--top) 8%,#161b29),#11141d);font-size:12px;font-weight:700;min-width:104px;text-align:center}
.mini-case .glyph{display:block;font-size:26px;color:var(--top)}

.main{padding:12px 14px;display:grid;gap:12px}
.card{--c:#8b5cf6;border:1px solid #242b3d;border-radius:16px;background:#131725;padding:16px}
.card h3{font-size:14.5px}
.card .hint{color:#8a93ab;font-size:12px;margin-top:4px;line-height:1.5}
.card .glyph{font-size:38px;color:var(--c);filter:drop-shadow(0 0 12px color-mix(in srgb,var(--c) 45%,transparent))}
.card-row{display:flex;align-items:center;gap:12px}
.card-row .info{display:flex;flex-direction:column;gap:3px}

.abtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin-top:12px;padding:14px 16px;border-radius:14px;background:linear-gradient(180deg,#ffd76a,#eaa11c);color:#231703;font-weight:800;font-size:15px;border:0}
.abtn.ghost{background:rgba(255,255,255,.04);color:#e8ecf4;border:1px solid #242b3d;font-weight:700}

.form{display:flex;gap:8px;margin-top:10px}
.form input{flex:1;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid #242b3d;background:#0d1019;color:inherit;font-size:16px}
.form input:focus{outline:none;border-color:#8b5cf6}
.form .send{flex:0 0 auto;min-width:52px;min-height:46px;border-radius:12px;border:1px solid rgba(255,201,60,.5);color:#ffc93c;font-weight:800}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(9,11,17,.9);backdrop-filter:blur(14px);border-top:1px solid #242b3d}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:12px;color:#565f79;font-size:10px;font-weight:700}
.tab .glyph{font-size:22px;line-height:1}
.tab.active{color:#ffc93c;background:rgba(255,201,60,.07)}
.tab.active::before{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:2px;background:#ffc93c;box-shadow:0 0 10px rgba(255,201,60,.7)}
.badge{position:absolute;top:2px;right:50%;margin-right:-26px;font-family:ui-monospace,monospace;font-size:9px;color:#231703;background:linear-gradient(180deg,#ffd76a,#eaa11c);padding:2px 6px;border-radius:999px;font-weight:800}

.snapshot{max-width:420px;height:800px;margin:0 auto;border:2px dashed #2a3145;border-radius:34px;overflow:hidden;position:relative;background:#0b0e16}
@media (max-width:520px){body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}.snapshot{border:0;border-radius:0;height:auto;min-height:100vh}}
</style>
</head>
<body>

<div class="snapshot">
  <div class="topbar">
    <span class="logo">ChessDep<i>.</i></span>
    <span class="chip"><i>◈</i> 1 250</span>
  </div>

  <div class="scroll-x">
    <span class="mini-case" style="--top:#9aa4b2"><span class="glyph">&#9823;&#xFE0E;</span>Стартовый</span>
    <span class="mini-case" style="--top:#ffc93c"><span class="glyph">&#9819;&#xFE0E;</span>Золотой</span>
    <span class="mini-case" style="--top:#8b5cf6"><span class="glyph">&#9818;&#xFE0E;</span>Чёрный</span>
    <span class="mini-case" style="--top:#ff5470"><span class="glyph">&#9822;&#xFE0E;</span>Турбо</span>
  </div>

  <div class="main">
    <div class="card">
      <div class="card-row">
        <span class="glyph">&#9819;&#xFE0E;</span>
        <span class="info"><h3>Апгрейд ферзь ×2</h3><span class="hint">шанс 23% · ставка 30 ◈</span></span>
      </div>
      <button class="abtn">Крутить</button>
    </div>

    <div class="card" style="--c:#ffc93c">
      <h3>Промокод</h3>
      <span class="hint">введи промокод партнёра → +◈ на баланс</span>
      <div class="form">
        <input type="text" placeholder="код" maxlength="12">
        <button class="send">OK</button>
      </div>
    </div>

    <div class="card" style="--c:#ff5470">
      <div class="card-row">
        <span class="glyph">&#9818;&#xFE0E;</span>
        <span class="info"><h3>Король ждёт</h3><span class="hint">твоя очередь в комнате #42</span></span>
      </div>
      <button class="abtn ghost">Продолжить партию</button>
    </div>
  </div>

  <nav class="tabbar">
    <span class="tab active"><span class="glyph">&#9818;&#xFE0E;</span>Лобби</span>
    <span class="tab"><span class="glyph">&#9819;&#xFE0E;</span>Кейсы</span>
    <span class="tab"><span class="badge">3</span><span class="glyph">&#9822;&#xFE0E;</span>Матч</span>
    <span class="tab"><span class="glyph">&#9670;&#xFE0E;</span>Мой склад</span>
    <span class="tab"><span class="glyph">&#9812;&#xFE0E;</span>Профиль</span>
  </nav>
</div>

<script>
const TABBAR_ITEMS = [
  { id: 'lobby',   glyph: '\u265A\uFE0E', label: 'Лобби' },
  { id: 'cases',   glyph: '\u265B\uFE0E', label: 'Кейсы' },
  { id: 'match',   glyph: '\u265E\uFE0E', label: 'Матч', badge: 3 },
  { id: 'storage', glyph: '\u265F\uFE0E', label: 'Мой склад' },
  { id: 'profile', glyph: '\u2655\uFE0E', label: 'Профиль' }
];

const ACTIVE_START = 'lobby';
const onTab = id => console.log('route ->', id);

const tabbar = document.querySelector('.tabbar');
tabbar.setAttribute('data-active', ACTIVE_START);
tabbar.addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b) return;
  tabbar.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
  const i = [...tabbar.children].indexOf(b);
  onTab(TABBAR_ITEMS[i] ? TABBAR_ITEMS[i].id : 'lobby');
});
</script>
</body>
</html>
