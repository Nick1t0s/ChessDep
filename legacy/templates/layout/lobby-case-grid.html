<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаблон 17 — лобби кейсов (сетка карточек)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(900px 400px at 50% -10%,rgba(139,92,246,.15),transparent 60%),#0b0e16;color:#e8ecf4;font-family:system-ui,-apple-system,sans-serif;padding:30px}
.wrap{max-width:1060px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
p.sub{color:#8a93ab;font-size:13px;margin-bottom:22px}
.lockrow{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.lockbtn{padding:9px 16px;border-radius:999px;border:1px solid #242b3d;color:#8a93ab;font-size:12.5px;font-weight:700}
.lockbtn.on{color:#231703;background:linear-gradient(180deg,#ffd76a,#eaa11c);border-color:transparent}

.casegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.casecard{
  --top:#ffc93c;
  position:relative;overflow:hidden;cursor:pointer;
  border:1px solid #242b3d;border-radius:16px;padding:20px 16px 16px;text-align:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--top) 8%,#161b29),#11141d);
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.casecard:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--top) 55%,transparent);box-shadow:0 18px 44px rgba(0,0,0,.55),0 0 30px color-mix(in srgb,var(--top) 16%,transparent)}
.casecard::before{content:"";position:absolute;top:-46px;left:50%;transform:translateX(-50%);width:140px;height:96px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--top) 26%,transparent),transparent);pointer-events:none}
.casecard .glyph{font-size:56px;line-height:1;color:var(--top);filter:drop-shadow(0 6px 16px color-mix(in srgb,var(--top) 40%,transparent))}
.casecard h3{font-size:16px;margin-top:10px}
.casecard .meta{color:#8a93ab;font-size:11.5px;margin-top:3px;font-family:ui-monospace,monospace}
.casecard .best{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:11.5px;color:#565f79}
.casecard .best b{color:#8a93ab;font-weight:600}
.casecard .buy{display:block;width:100%;margin-top:14px;padding:11px;border-radius:11px;background:linear-gradient(180deg,#ffd76a,#eaa11c);color:#231703;font-weight:800;font-size:14px;border:0;cursor:pointer}
.casecard .buy:hover{filter:brightness(1.07)}
.casecard.hot::after{content:"HOT";position:absolute;top:10px;right:-34px;transform:rotate(38deg);font-size:10px;font-weight:800;letter-spacing:1px;color:#231703;background:linear-gradient(180deg,#ffd76a,#eaa11c);padding:4px 40px}
.casecard .lvllock{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,8,14,.66);backdrop-filter:blur(2px);border-radius:15px;font-size:12.5px;color:#8a93ab}

.demo{border:1px solid #242b3d;border-radius:16px;padding:16px;background:#11141d;margin-top:18px;display:flex;align-items:center;gap:10px}
.phase{width:16px;height:16px;border-radius:5px;background:#1d2334}
.phase.on{background:#ffc93c;box-shadow:0 0 10px rgba(255,201,60,.7)}
.phase.on.pulse{animation:ph .5s infinite}
@keyframes ph{50%{transform:scale(1.35)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Шаблон 17 — лобби кейсов</h1>
  <p class="sub">Сетка карточек кейсов: акцентный цвет через --top, hot-плашка, lock-overlay по уровню. Каталог и покупки — payload бэка (getCaseCatalog / buyCase).</p>

  <div class="lockrow" id="locks"></div>
  <div class="casegrid" id="grid"></div>

  <div class="demo">
    <span style="color:#8a93ab;font-size:12px">фазы мульти-открытия:</span>
    <div class="phase on" id="p1"></div><div class="phase" id="p2"></div><div class="phase" id="p3"></div>
    <small style="color:#565f79">setPhase(1|2|3)</small>
  </div>
</div>

<script>
const ServerAPI = {
  async getCaseCatalog() {
    return [
      { id: 'starter', name: 'Стартовый',   glyph: '\u265F\uFE0E', top: '#9aa4b2', price: 50,  best: 'Конь',       locked: false, hot: false },
      { id: 'gold',    name: 'Золотой',     glyph: '\u265B\uFE0E', top: '#ffc93c', price: 150, best: 'Ферзь ×2',   locked: false, hot: true },
      { id: 'black',   name: 'Чёрный',      glyph: '\u265A\uFE0E', top: '#8b5cf6', price: 300, best: 'Король',     locked: false, hot: false },
      { id: 'turbo',   name: 'Турбо-кейс',  glyph: '\u265E\uFE0E', top: '#ff5470', price: 500, best: 'Gemmy',      locked: true,  need: 'ур. 10' },
      { id: 'myth',    name: 'Мифический',  glyph: '\u25C6\uFE0E', top: '#ff5470', price: 900, best: 'Кристалл',   locked: true,  need: 'ур. 25' }
    ];
  },
  async buyCase(caseId) {
    return { caseId, sessionId: 'demo-' + Math.floor(Math.random() * 9999) };
  }
};

const grid = document.getElementById('grid');
const locks = document.getElementById('locks');
const PHASES = [null, 'Крутка', 'Разбор', 'Сводка'];
let CASES = [];
const onEvent = e => console.log('lobby event:', e);

(async () => {
  CASES = await ServerAPI.getCaseCatalog();

  function renderLocks() {
    locks.innerHTML = CASES.map((c, i) =>
      `<button class="lockbtn${i === 0 ? ' on' : ''}" data-i="${i}">${c.name}</button>`
    ).join('');
    locks.querySelectorAll('.lockbtn').forEach(b => {
      b.addEventListener('click', () => {
        const i = +b.dataset.i;
        const c = CASES[i];
        document.querySelectorAll('.lockbtn').forEach(x => x.classList.toggle('on', x === b));
        if (c.locked) return;
        renderGrid(i);
      });
    });
  }

  function setPhase(n) {
    for (let i = 1; i <= 3; i++) {
      const p = document.getElementById('p' + i);
      p.classList.toggle('on', i <= n);
      p.classList.toggle('pulse', i === n);
    }
  }

  function renderGrid(sel) {
    grid.innerHTML = CASES.map(c =>
      `<div class="casecard${c.hot ? ' hot' : ''}" style="--top:${c.top}" data-id="${c.id}">
         ${c.locked ? `<div class="lvllock">🔒<br>Откроется · ${c.need || ''}</div>` : ''}
         <div class="glyph">&#${c.glyph.codePointAt(0).toString(10)};&#xFE0E;</div>
         <h3>Кейс «${c.name}»</h3>
         <div class="meta">324 предмета · топ ${c.best}</div>
         <span class="best">открыть · <b>${c.price} ◈</b></span>
         ${c.locked ? '' : `<button class="buy">Купить за ${c.price} ◈</button>`}
       </div>`
    ).join('');

    grid.querySelectorAll('.buy').forEach(b => {
      b.addEventListener('click', e => {
        e.stopPropagation();
        const card = b.closest('.casecard');
        ServerAPI.buyCase(card.dataset.id).then(s => {
          onEvent({ kind: 'case-open', caseId: card.dataset.id, session: s });
          setPhase(1);
        });
      });
    });
  }

  renderLocks();
  renderGrid(0);
})();
</script>
</body>
</html>
