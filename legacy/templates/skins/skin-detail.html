<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаблон 31 — карточка скина (детальная)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 400px at 50% -10%,rgba(139,92,246,.15),transparent 60%),#0b0e16;color:#e8ecf4;font-family:system-ui,-apple-system,sans-serif;padding:24px}
.detail{--c:#ffc93c;background:#131725;border:1px solid color-mix(in srgb,var(--c) 40%,#242b3d);border-radius:18px;padding:24px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px color-mix(in srgb,var(--c) 10%,transparent)}
.head{display:flex;align-items:flex-start;gap:10px}
.head h1{font-size:22px}
.head .meta{color:#8a93ab;font-size:12.5px;margin-top:4px}
.head .rtx{margin-left:auto;font-family:ui-monospace,monospace;font-size:12px;color:var(--c);border:1px solid var(--c);padding:5px 12px;border-radius:999px;text-transform:uppercase;letter-spacing:.6px}

.stage{position:relative;display:grid;place-items:center;height:230px;margin:18px 0;border-radius:16px;background:radial-gradient(320px 160px at 50% 68%,color-mix(in srgb,var(--c) 20%,transparent),transparent 70%),#0d1019;border:1px solid #242b3d;overflow:hidden}
.stage .glyph{font-size:120px;line-height:1;color:var(--c);filter:drop-shadow(0 0 30px color-mix(in srgb,var(--c) 65%,transparent));animation:floaty 3.4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px)}}
.stage .pedestal{position:absolute;bottom:22px;width:180px;height:10px;border-radius:8px;background:rgba(255,255,255,.06)}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.card{background:#0d1019;border:1px solid #242b3d;border-radius:14px;padding:14px}
.card h4{color:#8a93ab;font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:10px}

.wearrow{display:flex;justify-content:space-between;font-family:ui-monospace,monospace;font-size:10px;color:#565f79;margin-bottom:4px}
.wearbar{position:relative;height:8px;border-radius:6px;background:linear-gradient(90deg,#7dffb0,#38e8ff 25%,#ffc93c 55%,#ff7847 78%,#ff5470)}
.wearbar .pin{position:absolute;top:-5px;width:2.5px;height:18px;background:#e8ecf4;box-shadow:0 0 8px rgba(255,255,255,.8)}
.wearval{display:flex;justify-content:space-between;font-family:ui-monospace,monospace;font-size:11.5px;color:#8a93ab;margin-top:6px}
.wearval b{color:#e8ecf4}

.spark-c{width:100%;height:88px;display:block}
.pr-row{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.pr-row b{font-family:ui-monospace,monospace;font-size:26px;color:#ffc93c}
.pr-row span{color:#8a93ab;font-size:12px}
.pr-row .up{color:#7dffb0;font-size:12px;font-family:ui-monospace,monospace}

.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.btn{flex:1;min-width:140px;min-height:46px;padding:13px 16px;border-radius:12px;font-weight:800;font-size:14px}
.btn.primary{background:linear-gradient(180deg,#ffd76a,#eaa11c);color:#231703}
.btn.ghost{border:1px solid #2a3145;color:#8a93ab;font-weight:700}
.btn.rare{border:1px solid rgba(139,92,246,.5);color:#cdbcff;font-weight:700}
.stat-chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{font-family:ui-monospace,monospace;font-size:11px;color:#8a93ab;border:1px dashed #2a3145;padding:4px 10px;border-radius:7px}
</style>
</head>
<body>

<div class="detail">
  <div class="head">
    <div><h1 id="sk-name">Золотоноша</h1><div class="meta" id="sk-meta">скин на ферзя · скин-кейс «Золотой» · ID s02</div></div>
    <span class="rtx" id="sk-r">epic</span>
  </div>

  <div class="stage">
    <span class="glyph" id="sk-glyph">&#9819;&#xFE0E;</span>
    <span class="pedestal"></span>
  </div>

  <div class="grid2">
    <div class="card">
      <h4>Износ (CS-style float)</h4>
      <div class="wearrow"><span>0.00 Factory New</span><span>1.00 Потрёпаный</span></div>
      <div class="wearbar"><span class="pin" id="pin" style="left:15%"></span></div>
      <div class="wearval"><span>float: <b id="wear-val">0.15</b></span><span id="wear-txt">Moderately Worn</span></div>
    </div>

    <div class="card">
      <h4>Цена за 7 дней</h4>
      <canvas class="spark-c" id="sparks"></canvas>
      <div class="pr-row"><b id="price">240 ◈</b><span>средняя</span><span class="up">▲ 6% за неделю</span></div>
    </div>
  </div>

  <div class="stat-chips">
    <span class="chip">дропается из: Золотой, Чёрный</span>
    <span class="chip">шанс: 2.1%</span>
    <span class="chip">в обороте: 1 204 шт</span>
  </div>

  <div class="actions">
    <button class="btn primary" id="act-buy">Купить · 240 ◈</button>
    <button class="btn rare" id="act-up">В trade-up</button>
    <button class="btn ghost" id="act-gift">Подарить</button>
  </div>
</div>

<script>
const ServerAPI = {
  async getSkin() {
    return {
      id: 's02', slot: 'piece', pieceKind: 'queen', name: 'Золотоноша',
      rarity: 'epic', color: '#ffc93c', price: 240, wear: 0.15, glyph: '\u265B\uFE0E',
      dropFrom: ['Золотой', 'Чёрный'], dropChance: 2.1, supply: 1204, trend: 6,
      history: [206, 208, 207, 210, 212, 211, 214, 216, 213, 218, 219, 217, 221, 223, 222, 225, 224, 228, 227, 230, 229, 233, 232, 235, 234, 237, 238, 237, 240, 239]
    };
  }
};
const onAction = (a, data) => console.log('skin action:', a, data);

(async () => {
  const SKIN = await ServerAPI.getSkin();

  document.getElementById('act-buy').addEventListener('click', () => onAction('buy', SKIN));
  document.getElementById('act-up').addEventListener('click', () => onAction('tradeup', SKIN));
  document.getElementById('act-gift').addEventListener('click', () => onAction('gift', SKIN));

  const root = document.querySelector('.detail');
  root.style.setProperty('--c', SKIN.color);
  document.getElementById('sk-name').textContent = SKIN.name;
  document.getElementById('sk-meta').textContent = `скин на ${SKIN.pieceKind === 'queen' ? 'ферзя' : SKIN.pieceKind} · ID ${SKIN.id}`;
  document.getElementById('sk-r').textContent = SKIN.rarity;
  document.getElementById('sk-glyph').textContent = SKIN.glyph;
  document.getElementById('price').textContent = SKIN.price + ' ◈';
  document.getElementById('wear-val').textContent = SKIN.wear.toFixed(2);
  document.getElementById('pin').style.left = (SKIN.wear * 100) + '%';

  function wearText(w) {
    return w <= .07 ? 'Factory New' : w <= .15 ? 'Moderately Worn' : w <= .38 ? 'Field-Tested' : w <= .45 ? 'Well-Worn' : 'Потрёпаный';
  }
  document.getElementById('wear-txt').textContent = wearText(SKIN.wear);

  const chips = document.querySelectorAll('.chip');
  if (chips[0]) chips[0].textContent = `дропается из: ${SKIN.dropFrom.join(', ')}`;
  if (chips[1]) chips[1].textContent = `шанс: ${SKIN.dropChance}%`;
  if (chips[2]) chips[2].textContent = `в обороте: ${SKIN.supply.toLocaleString('ru-RU')} шт`;

  const cv = document.getElementById('sparks');
  const ctx = cv.getContext('2d');
  let w = 0, h = 0;
  const gen = SKIN.history;

  function fit() {
    const r = cv.getBoundingClientRect();
    w = r.width; cv.width = w; h = r.height; cv.height = h;
    drawSpark();
  }
  addEventListener('resize', fit);

  function drawSpark() {
    if (!w) return;
    ctx.clearRect(0, 0, w, h);
    const min = Math.min(...gen), max = Math.max(...gen);
    const pad = 8;
    const X = i => pad + i / (gen.length - 1) * (w - pad * 2);
    const Y = v => h - pad - (v - min) / (max - min || 1) * (h - pad * 2);
    ctx.strokeStyle = SKIN.color;
    ctx.lineWidth = 2;
    ctx.shadowColor = SKIN.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    gen.forEach((v, i) => i === 0 ? ctx.moveTo(X(i), Y(v)) : ctx.lineTo(X(i), Y(v)));
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.lineTo(X(gen.length - 1), h);
    ctx.lineTo(X(0), h);
    ctx.fillStyle = SKIN.color + '22';
    ctx.fill();
  }
  fit();
})();
</script>
</body>
</html>
